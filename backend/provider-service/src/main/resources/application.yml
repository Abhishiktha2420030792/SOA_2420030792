server:
  port: 8083

spring:
  application:
    name: provider-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/carebridge_provider_db}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWYwMTIzNDU2Nzg5YWJjZGVm}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.carebridge: INFO
spring.security.debug: true
